{{define "content"}}
<h1>Log in</h1>
<p class="muted small">You stay logged in for {{.D.Hours}} hours on this browser.</p>
<form method="post" autocomplete="off">
<input type="hidden" name="next" value="{{.D.Next}}">
<label for="password">Admin password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
<label for="code">Authenticator code</label>
<input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9 ]*" autocomplete="one-time-code" required>
<label class="check"><input type="checkbox" name="remember" value="1" checked> Remember this device: stay logged in and approve without a code (forget it any time on the approvals page)</label>
<div class="btn-row"><button class="btn primary" style="width:100%">Log in</button></div>
</form>
<p class="muted small" style="margin-top:1.2rem">Connecting Claude? Add <code>{{.D.MCP}}</code> as a custom connector in Claude (Settings → Connectors).</p>
{{end}}
