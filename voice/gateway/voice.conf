# API gateway for the voice stack: one base URL, one Bearer key.
#   /v1/audio/transcriptions -> models-merge (model fallback) -> speaches (Whisper)
#   /v1/audio/*  -> speaches (Whisper)
#   /v1/models   -> models-merge (speech + cleanup models together)
#   /v1/chat/*   -> ollama (cleanup / rewording)
#   /v1/vk/*     -> vk-learn (per-person learning; X-VK-User set from the key)
#   /v1/vk/pair* -> voice-pair (Wi-Fi setup, docs/server-pairing.md in the voice-keyboard repo): NO key,
#                   home LAN only (10.10.1.0/24 real client address; the tunnel arrives as 172.18.0.1 and
#                   Traefik as 10.10.11.102, both refused), rate-limited.
#   /health      -> no key (for monitoring); everything else needs the key.
map_hash_bucket_size 128;
include /etc/nginx/voice/key.conf;          # defines $voice_auth_ok (1 = right key)
map $uri $voice_allowed {
  /health  1;
  ~^/v1/vk/pair(/|$)  1;               # pairing: no key, but LAN-only (checked in its location)
  default  $voice_auth_ok;
}
geo $voice_pair_lan {                  # home Wi-Fi / Main network only
  default       0;
  10.10.1.0/24  1;
}
map $http_cf_connecting_ip$http_x_forwarded_for$http_forwarded $voice_pair_proxied {
  ""       0;                          # a direct LAN request carries none of these
  default  1;
}
limit_req_zone $binary_remote_addr zone=vkpair:1m rate=5r/m;        # info + new requests
limit_req_zone $binary_remote_addr zone=vkpairpoll:1m rate=30r/m;   # status polling (app: every 3 s)
server {
  listen 8080;
  client_max_body_size 50m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  # Checked at server level so it applies to every location below.
  if ($voice_allowed = 0) { return 401 '{"error":"invalid or missing API key"}'; }
  location = /health    { access_log off; return 200 "ok\n"; }
  # Transcriptions go through models-merge: an unknown or unloadable model (e.g. a person's
  # fine-tuned model that is not ready) falls back to the default instead of an error.
  location = /v1/audio/transcriptions { proxy_set_header Authorization ""; proxy_pass http://models-merge:8081; }
  location /v1/audio/   { proxy_pass http://speaches:8000; }
  location = /v1/models { proxy_pass http://models-merge:8081; }   # speech + cleanup models together
  location /v1/chat/    { proxy_set_header Authorization ""; proxy_pass http://ollama:11434; }
  # Wi-Fi pairing: no key, home LAN only, never through the tunnel or a proxy.
  set $pair_refused '{"error":"pairing is only available on the home Wi-Fi"}';
  location = /v1/vk/pair/info {
    if ($voice_pair_lan = 0)     { return 403 $pair_refused; }
    if ($voice_pair_proxied = 1) { return 403 $pair_refused; }
    limit_req_status 429;
    limit_req zone=vkpair burst=4 nodelay;
    proxy_set_header Authorization "";
    proxy_set_header X-VK-User "";
    proxy_set_header X-VK-Device "";
    proxy_set_header X-Pair-Client $remote_addr;
    proxy_pass http://172.18.0.1:8083;   # voice-pair (host service on the Docker bridge)
  }
  location = /v1/vk/pair {
    if ($voice_pair_lan = 0)     { return 403 $pair_refused; }
    if ($voice_pair_proxied = 1) { return 403 $pair_refused; }
    limit_req_status 429;
    limit_req zone=vkpair burst=4 nodelay;
    proxy_set_header Authorization "";
    proxy_set_header X-VK-User "";
    proxy_set_header X-VK-Device "";
    proxy_set_header X-Pair-Client $remote_addr;
    proxy_pass http://172.18.0.1:8083;   # voice-pair (host service on the Docker bridge)
  }
  location ~ ^/v1/vk/pair/[A-Za-z0-9_-]{20,64}$ {     # status of one request (the app polls every 3 s)
    if ($voice_pair_lan = 0)     { return 403 $pair_refused; }
    if ($voice_pair_proxied = 1) { return 403 $pair_refused; }
    limit_req_status 429;
    limit_req zone=vkpairpoll burst=10 nodelay;
    proxy_set_header Authorization "";
    proxy_set_header X-VK-User "";
    proxy_set_header X-VK-Device "";
    proxy_set_header X-Pair-Client $remote_addr;
    proxy_pass http://172.18.0.1:8083;   # voice-pair (host service on the Docker bridge)
  }
  location ~ ^/v1/vk/pair { return 404 '{"error":"not found"}'; }
  location /v1/vk/      {                 # Phase 2 learning service; identity comes ONLY from the key
    proxy_set_header X-VK-User   $voice_user;
    proxy_set_header X-VK-Device $voice_device;
    proxy_set_header Authorization "";
    proxy_pass http://vk-learn:8082;
  }
  location /            { return 404 '{"error":"not found"}'; }
}
